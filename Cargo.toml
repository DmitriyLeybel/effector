[package]
name = "effector"
version = "0.2.0"
edition = "2024"
description = "Chrome-native broker and MCP server for Effector"
license = "MIT"
readme = "README.md"
keywords = ["chrome", "mcp", "browser", "native-messaging"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "effector"
path = "native/src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rand = "0.10"
rmcp = { version = "3.0.1", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
